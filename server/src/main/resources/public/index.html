<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Orrery</title>
<link rel="icon" type="image/png" href="./favicon.png">
<style>
  html, body { margin: 0; height: 100%; background: #05070d; color: #cfd6e4;
               font: 13px/1.5 ui-monospace, "SF Mono", Menlo, monospace; overflow: hidden; }
  canvas { display: block; position: fixed; inset: 0; }
  canvas.hidden { display: none; }
  /* Score at the top middle where a scoreboard belongs; the debug readout down
     in the corner, small and quiet, where it does not sit on the arena. */
  #score { position: fixed; top: 14px; left: 0; right: 0; text-align: center;
           pointer-events: none; font-size: 20px; letter-spacing: 2px;
           text-shadow: 0 2px 6px #000; }
  #score b { font-weight: 700; }
  #score .norse { color: #7fa8e3; }
  #score .greek { color: #e0b062; }
  #hud { position: fixed; bottom: 12px; left: 14px; pointer-events: none;
         white-space: pre; font-size: 12px; color: #7c8798;
         text-shadow: 0 1px 2px #000; }
  #hud b { color: #7fe3c0; font-weight: 600; }
  #warn { color: #e8b04b; }

  /* The lobby sits over the arena, which keeps running behind it. Watching the
     star drift while you choose a side is better than a blank screen, and it
     also means the connection is visibly alive before you commit to anything. */
  #overlay { position: fixed; inset: 0; display: none; place-items: center;
             background: radial-gradient(circle at 50% 45%, rgba(5,7,13,.55), rgba(5,7,13,.9)); }
  #overlay.show { display: grid; }
  #panel { text-align: center; }
  #panel h1 { margin: 0 0 6px; font-size: 46px; letter-spacing: 10px; font-weight: 300;
              color: #ffe9b0; text-shadow: 0 0 28px rgba(255,196,90,.35); }
  /* The drawn wordmark replaces the CSS one on the title screen only. The side
     picker keeps type, because a picture of the word "PICK A SIDE" would be a
     picture of an instruction. */
  #panel img.wordmark { width: min(520px, 70vw); display: block; margin: 0 auto 4px; }
  #panel .tag { color: #7c8798; margin-bottom: 30px; letter-spacing: 1px; }
  button { font: inherit; letter-spacing: 2px; color: #cfd6e4; cursor: pointer;
           background: transparent; border: 1px solid #2a3752; border-radius: 3px;
           padding: 12px 30px; transition: border-color .15s, color .15s; }
  button:hover { border-color: #7fe3c0; color: #7fe3c0; }
  .sides { display: flex; gap: 16px; justify-content: center; }
  .sides button.norse:hover { border-color: #7fa8e3; color: #7fa8e3; }
  .sides button.greek:hover { border-color: #e0b062; color: #e0b062; }
  .count { font-size: 12px; color: #7c8798; margin-top: 10px; letter-spacing: 1px; }
  /* Goals and match wins, in the DOM so both renderers show them. They used to
     be painted onto the 2D canvas, which meant the 3D view announced nothing at
     all: the world simply stopped for a second and a half with no explanation,
     and a match ending looked exactly like the game breaking. */
  #banner { position: fixed; inset: 0; display: grid; place-items: center;
            pointer-events: none; text-align: center; opacity: 0; transition: opacity .2s; }
  #banner.show { opacity: 1; }
  #banner .big { font-size: 64px; letter-spacing: 12px; font-weight: 300;
                 color: #ffe9b0; text-shadow: 0 0 40px rgba(255,196,90,.45); }
  #banner .sub { margin-top: 10px; color: #cfd6e4; letter-spacing: 2px; }
  #countdown { font-size: 96px; font-weight: 200; color: #ffe9b0;
               text-shadow: 0 0 40px rgba(255,196,90,.4); }
  .hint { color: #7c8798; font-size: 12px; margin-top: 26px; letter-spacing: .5px; }
</style>
</head>
<body>
<!-- Two canvases, because a canvas only ever gets one kind of context. Asking
     for 2D at load, as this file used to, permanently prevents WebGL from
     attaching to the same element, and the 3D renderer failed with a warning
     nobody was reading. -->
<canvas id="c3d" class="hidden"></canvas>
<canvas id="c"></canvas>
<div id="score"></div>
<div id="hud"></div>
<div id="banner"><div><div class="big"></div><div class="sub"></div></div></div>
<div id="overlay"><div id="panel"></div></div>
<script type="module" src="./game.mjs"></script>
</body>
</html>
