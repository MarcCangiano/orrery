<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Orrery</title>
<style>
  html, body { margin: 0; height: 100%; background: #05070d; color: #cfd6e4;
               font: 13px/1.5 ui-monospace, "SF Mono", Menlo, monospace; overflow: hidden; }
  canvas { display: block; }
  #hud { position: fixed; top: 12px; left: 14px; pointer-events: none; white-space: pre;
         text-shadow: 0 1px 2px #000; }
  #hud b { color: #7fe3c0; font-weight: 600; }
  #warn { color: #e8b04b; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"></div>
<script>
// The dumbest client that can possibly be correct: draw exactly what the server
// last said, nothing else. No prediction, no interpolation. It will feel bad,
// and that is the point. You cannot tell whether prediction helped if you never
// felt the version without it.

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const hud = document.getElementById('hud');

let world = { w: 120, h: 70 };
let myId = null;
let bodies = [];
let serverTick = 0;

let seq = 0;
const sentAt = new Map();   // seq -> performance.now(), for a real round trip number
let rttMs = 0;
let snapshotsThisSecond = 0, snapshotRate = 0, lastRateAt = performance.now();

const keys = new Set();
addEventListener('keydown', e => { keys.add(e.key.toLowerCase()); });
addEventListener('keyup',   e => { keys.delete(e.key.toLowerCase()); });

function resize() {
  canvas.width = innerWidth * devicePixelRatio;
  canvas.height = innerHeight * devicePixelRatio;
  canvas.style.width = innerWidth + 'px';
  canvas.style.height = innerHeight + 'px';
}
addEventListener('resize', resize);
resize();

const proto = location.protocol === 'https:' ? 'wss' : 'ws';
const ws = new WebSocket(`${proto}://${location.host}/ws`);
ws.onopen = () => console.log('connected');
ws.onclose = () => console.log('disconnected');

ws.onmessage = ev => {
  const m = JSON.parse(ev.data);
  if (m.t === 'welcome') {
    myId = m.id;
    world = { w: m.w, h: m.h };
  } else if (m.t === 'state') {
    bodies = m.bodies;
    serverTick = m.tick;
    snapshotsThisSecond++;
    // The server echoes the last input it consumed, so this is a true round
    // trip through the simulation rather than a ping alongside it.
    const t0 = sentAt.get(m.ack);
    if (t0 !== undefined) {
      rttMs = performance.now() - t0;
      for (const k of sentAt.keys()) { if (k <= m.ack) sentAt.delete(k); }
    }
  }
};

function input() {
  let ax = 0, ay = 0;
  if (keys.has('a') || keys.has('arrowleft'))  ax -= 1;
  if (keys.has('d') || keys.has('arrowright')) ax += 1;
  if (keys.has('w') || keys.has('arrowup'))    ay -= 1;
  if (keys.has('s') || keys.has('arrowdown'))  ay += 1;
  // Normalize so diagonal thrust isn't 1.41x faster than straight.
  const len = Math.hypot(ax, ay);
  if (len > 0) { ax /= len; ay /= len; }
  return { ax, ay };
}

setInterval(() => {
  if (ws.readyState !== WebSocket.OPEN) return;
  const { ax, ay } = input();
  seq++;
  sentAt.set(seq, performance.now());
  ws.send(JSON.stringify({ t: 'input', seq, ax, ay }));
}, 1000 / 60);

function draw() {
  const now = performance.now();
  if (now - lastRateAt >= 1000) {
    snapshotRate = snapshotsThisSecond;
    snapshotsThisSecond = 0;
    lastRateAt = now;
  }

  const W = canvas.width, H = canvas.height;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#05070d';
  ctx.fillRect(0, 0, W, H);

  // Fit the arena on screen with a margin, keeping aspect.
  const scale = Math.min(W / (world.w + 8), H / (world.h + 8));
  const ox = (W - world.w * scale) / 2;
  const oy = (H - world.h * scale) / 2;
  ctx.setTransform(scale, 0, 0, scale, ox, oy);
  ctx.lineWidth = 2 / scale;

  // The cage.
  ctx.strokeStyle = '#1c2740';
  ctx.strokeRect(0, 0, world.w, world.h);

  for (const b of bodies) {
    const mine = b.id === myId;
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
    ctx.fillStyle = mine ? '#7fe3c0' : '#4a6fa5';
    ctx.fill();

    // A velocity whisker. Handy for seeing what the server thinks you are doing.
    ctx.beginPath();
    ctx.moveTo(b.x, b.y);
    ctx.lineTo(b.x + b.vx * 0.12, b.y + b.vy * 0.12);
    ctx.strokeStyle = mine ? 'rgba(127,227,192,.55)' : 'rgba(74,111,165,.5)';
    ctx.stroke();
  }

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  hud.innerHTML =
    `orrery  <b>you are ${myId ?? '...'}</b>\n` +
    `tick ${serverTick}   snapshots ${snapshotRate}/s   rtt ${rttMs.toFixed(0)}ms\n` +
    `bodies ${bodies.length}\n` +
    `<span id="warn">prediction: off — you are watching the past</span>\n` +
    `WASD to thrust`;

  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
